<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}School Management{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1f2937;
            min-height: 100vh;
        }

        /* NAVBAR */
        nav {
            background: linear-gradient(90deg, #111827, #1f2937);
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left,
        .nav-right {
            display: flex;
            align-items: center;
        }

        nav a {
            color: #e5e7eb;
            text-decoration: none;
            margin-right: 22px;
            font-weight: 600;
            font-size: 15px;
            position: relative;
            transition: color 0.2s ease;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0;
            height: 2px;
            background: #38bdf8;
            transition: width 0.25s ease;
        }

        nav a:hover {
            color: #38bdf8;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* LOGOUT BUTTON */
        .logout {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            padding: 8px 16px;
            border-radius: 999px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239,68,68,0.4);
            color: white;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 960px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-left {
                flex-wrap: wrap;
                margin-bottom: 10px;
            }

            nav a {
                margin-bottom: 8px;
            }

            .container {
                margin: 30px 16px;
                padding: 24px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<nav>
    <div class="nav-left">
        <a href="{% url 'home' %}">Home</a>

        {% if is_teacher or is_principal %}
            <a href="#">Users</a>
            <a href="#">Reports</a>
        {% endif %}
    </div>

    <div class="nav-right">
        <a href="{% url 'logout' %}" class="logout">Logout</a>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
